name: Python sequence-analysis tests

on:
  push:
    paths:
      - "code/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "code/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
